apply plugin: 'com.android.application'

// Version unique : public/version.json (ex. "0.14.2-cube-clair" → versionName 0.14.2, versionCode 1402).
def appVersion = new groovy.json.JsonSlurper()
        .parse(rootProject.file('../public/version.json')).version.tokenize('-')[0]
def appVersionCode = appVersion.tokenize('.').inject(0) { code, part -> code * 100 + part.toInteger() }

// AdMob : source unique src/features/ads/ads.json (voir docs/admob.md).
// Seuls l'éditeur de démonstration de Google et l'éditeur JavaChrist sont acceptés (voir src/features/ads/rules.ts).
def admobAppId = new groovy.json.JsonSlurper().parse(rootProject.file('../src/features/ads/ads.json')).androidAppId
if (!(admobAppId ==~ /(ca-app-pub-3940256099942544|ca-app-pub-8288172940135426)~\d+/)) {
    throw new GradleException("ID d'application AdMob refusé : éditeur de démonstration Google ou JavaChrist uniquement")
}

// Clé d'envoi Play : android/keystore.properties (hors Git), voir keystore.properties.example.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace = "fr.javachrist.cubelyo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.javachrist.cubelyo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        manifestPlaceholders = [admobAppId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google Play Billing (plugin local PlayBillingPlugin) : ajoute com.android.vending.BILLING au manifeste.
    implementation "com.android.billingclient:billing:$playBillingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
